<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Appointments | H Evans Optometrist</title>
<link rel="icon" href="/admin/icons/staff-app.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141f4a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="H Evans Staff">
<style>
:root{--bg:#fff;--bg2:#f1f8fb;--tx:#141f4a;--sub:#505a8a;--ln:rgba(20,31,74,.16);--ac:#34accb;--ok:#1f7a4d;--no:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15120d;--bg2:#1e1a13;--tx:#f2e9d8;--sub:#bfb39b;--ln:rgba(242,233,216,.18);--ac:#eea84a;--ok:#6fcf97;--no:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
button,.btn{font:600 .95rem system-ui,sans-serif;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--ac);color:#0a1033;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}
button.no{background:transparent;color:var(--no);box-shadow:inset 0 0 0 1px var(--no)}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
#login{max-width:360px;margin:12vh auto 0}
input{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:8px 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}
.tabs button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row h2{font-size:1.1rem;margin:0}
.badge{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;box-shadow:inset 0 0 0 1px currentColor;white-space:nowrap}
.badge.confirmed{color:var(--ok)}.badge.declined{color:var(--no)}.badge.pending{color:var(--sub)}
.meta{color:var(--sub);font-size:.92rem;margin:4px 0}
.meta b{color:var(--tx)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{min-height:1.4em;margin:0 0 12px;font-weight:600}
.err{color:var(--no)}
a{color:inherit}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.dow{font-size:.7rem;text-align:center;color:var(--sub);font-weight:700;text-transform:uppercase;padding-bottom:2px}
.day{min-height:56px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-weight:600;cursor:pointer}
.day.empty{border:0;background:transparent;pointer-events:none}
.day.today{box-shadow:inset 0 0 0 2px var(--ac)}
.day.sel{background:var(--tx);color:var(--bg)}
.cnt{align-self:flex-end;font-size:.75rem;min-width:22px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--ok);color:var(--bg)}
.cnt.p{background:var(--ac);color:#0a1033}
@media (max-width:480px){.cal{gap:3px}.day{min-height:48px;padding:4px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<form id="login" class="card">
 <h1>Staff sign in</h1>
 <label for="username" class="meta">Username</label>
 <input id="username" autocomplete="username" required>
 <label for="pw" class="meta">Password</label>
 <input id="pw" type="password" autocomplete="current-password" required>
 <p class="msg err" id="loginErr" role="alert"></p>
 <label class="meta" style="display:flex;gap:10px;align-items:flex-start;margin:0 0 14px"><input id="rem" type="checkbox" style="width:auto;margin:4px 0 0"><span>Keep me signed in on this device for 30 days. Only tick this on a phone or computer you trust.</span></label>
 <button type="submit" style="width:100%">Sign in</button>
 <p class="meta" style="margin-top:14px">First time setting up staff access? <button type="button" class="ghost" id="showSetup">Set up doctor account</button></p>
</form>
<form id="setup" class="card" hidden>
 <h1>Initial doctor setup</h1>
 <p class="meta">This creates the owner account. The setup key must first be added to Netlify environment variables.</p>
 <label class="meta" for="setupSecret">Setup key</label><input id="setupSecret" type="password" required autocomplete="off">
 <label class="meta" for="doctorName">Doctor name</label><input id="doctorName" required>
 <label class="meta" for="doctorUsername">Username</label><input id="doctorUsername" required autocomplete="username">
 <label class="meta" for="doctorPassword">Password (at least 12 characters)</label><input id="doctorPassword" type="password" required minlength="12" autocomplete="new-password">
 <p class="msg err" id="setupErr" role="alert"></p>
 <button type="submit" style="width:100%">Create doctor account</button>
 <p class="meta"><button type="button" class="ghost" id="hideSetup">Back to sign in</button></p>
</form>
<div id="app" hidden>
 <header><h1>Appointments</h1><div><button class="ghost" id="install" type="button" hidden>Install app</button> <button class="ghost" id="refresh" type="button">Refresh</button> <button class="ghost" id="out" type="button">Log out</button></div></header>
 <section class="card" id="pushPrompt" hidden></section>
 <div class="tabs" id="tabs" role="group" aria-label="Filter"></div>
 <p class="msg" id="msg" role="status"></p>
 <div id="list"></div>
</div>
</div>
<script>
(function(){
var installPrompt=null;
var installButton=document.getElementById("install");
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/admin/service-worker.js").catch(function(error){
      console.error("Staff app service worker registration failed:",error);
    });
  });
}
window.addEventListener("beforeinstallprompt",function(event){
  event.preventDefault();
  installPrompt=event;
  if(installButton)installButton.hidden=false;
});
if(installButton){
  installButton.addEventListener("click",async function(){
    if(!installPrompt)return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt=null;
    installButton.hidden=true;
  });
}
window.addEventListener("appinstalled",function(){
  if(installButton)installButton.hidden=true;
});
var T=null,items=[],revs=[],currentUser=null,tab="calendar",cal=new Date(),calSel="";cal.setDate(1);
try{T=localStorage.getItem("hev_t")||sessionStorage.getItem("hev_t")}catch(e){}
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function api(body){
 return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({token:T},body))})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,status:r.status,j:j}})})
  .catch(function(){return {ok:false,status:0,j:{error:"No connection. Please try again."}}});
}
function say(t,bad){var m=$("msg");m.textContent=t||"";m.className="msg"+(bad?" err":"")}
function show(on){$("login").hidden=on;$("setup").hidden=true;$("app").hidden=!on}
function logout(){T=null;currentUser=null;try{sessionStorage.removeItem("hev_t");localStorage.removeItem("hev_t")}catch(e){}show(false)}
function load(){
 api({action:"list"}).then(function(r){
  if(r.status===401){logout();return}
  if(!r.ok){say(r.j.error||"Couldn’t load appointments.",true);return}
  items=r.j.items;say("");showPushPrompt();draw();
  api({action:"reviews"}).then(function(q){if(q.ok){revs=q.j.items;draw()}});
 });
}
function showPushPrompt(){
 var card=$("pushPrompt");
 if(!card)return;
 card.innerHTML="";
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
  card.hidden=true;return;
 }
 if(Notification.permission==="denied"){
  card.hidden=false;
  card.appendChild(el("h2","","Notifications are blocked"));
  card.appendChild(el("p","meta","Allow notifications for this site in your browser or device settings, then reopen the staff app."));
  return;
 }
 navigator.serviceWorker.ready.then(function(registration){
  registration.pushManager.getSubscription().then(function(subscription){
   if(subscription&&Notification.permission==="granted"){card.hidden=true;return}
   card.hidden=false;
   card.appendChild(el("h2","","Enable staff notifications"));
   card.appendChild(el("p","meta","Get an alert on this device whenever a new appointment request arrives. Alerts never include patient details."));
   var enable=btn("Enable notifications","",async function(button){
    button.disabled=true;
    try{
     if(Notification.permission!=="granted"){
      var permission=await Notification.requestPermission();
      if(permission!=="granted")throw new Error("Permission was not granted. You can enable it later in your browser settings.");
     }
     var keyResult=await api({action:"push_public_key"});
     if(!keyResult.ok||!keyResult.j.publicKey)throw new Error("Push notifications are not configured on the server yet.");
     var current=await registration.pushManager.getSubscription();
     if(!current)current=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyResult.j.publicKey)});
     var saved=await api({action:"push_subscribe",subscription:current.toJSON()});
     if(!saved.ok)throw new Error(saved.j.error||"Could not save this device.");
     card.hidden=true;
     say("Notifications are enabled on this device.");
    }catch(error){
     var message=el("p","meta",error.message||"Could not enable notifications.");
     card.appendChild(message);
     button.disabled=false;
    }
   });
   card.appendChild(enable);
   var later=btn("Not now","ghost",function(){card.hidden=true});
   card.appendChild(later);
  }).catch(function(){card.hidden=true});
 }).catch(function(){card.hidden=true});
}
function draw(){
 var tabs=$("tabs");tabs.innerHTML="";
 [["calendar","Calendar"],["pending","Pending"],["confirmed","Confirmed"],["declined","Declined"],["all","All"],["reviews","Reviews"],["account","My account"]].concat(currentUser&&currentUser.role==="doctor"?[["staff","Staff accounts"],["activity","Activity log"]]:[]).forEach(function(t){
  var n=t[0]==="reviews"?revs.filter(function(a){return a.status==="pending"}).length:t[0]==="all"?items.length:(["pending","confirmed","declined"].indexOf(t[0])>=0?items.filter(function(a){return a.status===t[0]}).length:0);
  var b=el("button","",(t[0]==="calendar"||t[0]==="account"||t[0]==="staff"||t[0]==="activity")?t[1]:t[1]+" ("+n+")");b.type="button";b.setAttribute("aria-pressed",String(tab===t[0]));
  b.onclick=function(){tab=t[0];draw()};tabs.appendChild(b);
 });
 if(tab==="calendar"){drawCal();return}
 if(tab==="reviews"){drawRevs();return}
 if(tab==="staff"){drawStaff();return}
 if(tab==="activity"){drawActivity();return}
 if(tab==="account"){drawAccount();return}
 var list=$("list");list.innerHTML="";
 var shown=items.filter(function(a){return tab==="all"||a.status===tab});
 if(!shown.length){var e=el("div","card","Nothing here.");e.style.color="var(--sub)";list.appendChild(e);return}
 shown.forEach(function(a){
  var c=el("article","card"),h=el("div","row");
  h.appendChild(el("h2","",a.name));h.appendChild(el("span","badge "+a.status,a.status));c.appendChild(h);
  var l=el("p","meta");l.appendChild(el("b","",a.date+" at "+a.time));c.appendChild(l);
  c.appendChild(el("p","meta",a.service));
  var ph=el("p","meta");var tel=el("a","",a.phone);tel.href="tel:"+a.phone.replace(/[^\d+]/g,"");ph.appendChild(tel);
  if(a.email)ph.appendChild(document.createTextNode(" · "+a.email));c.appendChild(ph);
  if(a.notes)c.appendChild(el("p","meta","Notes: "+a.notes));
  var wn=waNote(a);if(wn)c.appendChild(wn);
  var acts=el("div","acts");
  if(a.status!=="confirmed")acts.appendChild(btn("Approve","",function(b){set(a,"confirmed",b)}));
  if(a.status!=="declined")acts.appendChild(btn(a.status==="confirmed"?"Cancel":"Decline","no",function(b){set(a,"declined",b)}));
  if(a.status==="declined")acts.appendChild(btn("Delete","no",function(b){del(a,b)}));
  waButtons(a,acts);
  c.appendChild(acts);list.appendChild(c);
 });
}
var CAL_NOTE="Highlighted badge = day has requests waiting. Green badge = all confirmed. Declined are hidden.";
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function drawCal(){
 var list=$("list");list.innerHTML="";
 var by={};items.forEach(function(a){if(a.status!=="declined"){(by[a.iso]=by[a.iso]||[]).push(a)}});
 var y=cal.getFullYear(),m=cal.getMonth(),todayKey=iso(new Date());
 var c=el("div","card"),h=el("div","row");h.style.alignItems="center";
 var pv=btn("‹","ghost",function(){cal.setMonth(m-1);calSel="";draw()});pv.setAttribute("aria-label","Previous month");
 var nx=btn("›","ghost",function(){cal.setMonth(m+1);calSel="";draw()});nx.setAttribute("aria-label","Next month");
 h.appendChild(pv);h.appendChild(el("h2","",cal.toLocaleDateString("en-ZA",{month:"long",year:"numeric"})));h.appendChild(nx);c.appendChild(h);
 var g=el("div","cal");
 ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){g.appendChild(el("div","dow",d))});
 var lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),i;
 for(i=0;i<lead;i++)g.appendChild(el("div","day empty"));
 for(i=1;i<=days;i++){(function(d){
  var key=iso(new Date(y,m,d)),ap=by[key]||[];
  var cell=el("button","day"+(key===todayKey?" today":"")+(key===calSel?" sel":""));cell.type="button";
  cell.appendChild(el("span","",String(d)));
  if(ap.length){
   var pend=ap.some(function(a){return a.status==="pending"});
   cell.appendChild(el("span","cnt"+(pend?" p":""),String(ap.length)));
   cell.setAttribute("aria-label",d+" "+cal.toLocaleDateString("en-ZA",{month:"long"})+": "+ap.length+(ap.length===1?" appointment":" appointments"));
  }
  cell.onclick=function(){calSel=key;draw()};
  g.appendChild(cell);
 })(i)}
 c.appendChild(g);c.appendChild(el("p","meta",CAL_NOTE));list.appendChild(c);
 var day=calSel||(todayKey.slice(0,7)===iso(cal).slice(0,7)?todayKey:"");
 if(!day){list.appendChild(el("p","meta","Tap a day to see its appointments."));return}
 var ap=(by[day]||[]).slice().sort(function(a,b){return a.time.localeCompare(b.time)});
 var hd=el("h2","",new Date(day+"T00:00:00").toLocaleDateString("en-ZA",{weekday:"long",day:"numeric",month:"long"}));hd.style.cssText="font-size:1.1rem;margin:20px 0 10px";list.appendChild(hd);
 if(!ap.length){list.appendChild(el("div","card","No appointments this day."));return}
 ap.forEach(function(a){
  var cd=el("article","card"),r=el("div","row");
  r.appendChild(el("h2","",a.time+" · "+a.name));r.appendChild(el("span","badge "+a.status,a.status));cd.appendChild(r);
  cd.appendChild(el("p","meta",a.service));
  var ph=el("p","meta");var tel=el("a","",a.phone);tel.href="tel:"+a.phone.replace(/[^\d+]/g,"");ph.appendChild(tel);cd.appendChild(ph);
  if(a.notes)cd.appendChild(el("p","meta","Notes: "+a.notes));
  var wn=waNote(a);if(wn)cd.appendChild(wn);
  var acts=el("div","acts");
  if(a.status!=="confirmed")acts.appendChild(btn("Approve","",function(b){set(a,"confirmed",b)}));
  acts.appendChild(btn(a.status==="confirmed"?"Cancel":"Decline","no",function(b){set(a,"declined",b)}));
  waButtons(a,acts);
  cd.appendChild(acts);list.appendChild(cd);
 });
}
function when(iso){return new Date(iso).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function waNote(a){
 if(a.status!=="confirmed")return null;
 if(!a.whatsappConsent)return el("p","meta","No WhatsApp consent. Please phone the patient to confirm.");
 if(a.whatsappConfirmedAt)return el("p","meta","✓ WhatsApp confirmation sent by "+((a.whatsappConfirmedBy&&a.whatsappConfirmedBy.name)||"a staff member")+" · "+when(a.whatsappConfirmedAt));
 return null;
}
function waButtons(a,acts){
 if(a.status==="confirmed"&&a.whatsappConsent){
  if(!a.whatsappConfirmedAt)acts.appendChild(btn("Confirm via WhatsApp","",function(b){sendWa(a,b)}));
  else if(currentUser&&currentUser.role==="doctor")acts.appendChild(btn("Allow resend","ghost",function(b){resetWa(a,b)}));
 }
 if(a.wa){var w=el("a","btn ghost","Message on WhatsApp");w.href=a.wa;w.target="_blank";w.rel="noopener";acts.appendChild(w)}
}
function sendWa(a,b){
 var win=window.open("","_blank"); // opened straight away so the browser allows it
 b.disabled=true;
 api({action:"whatsapp_confirm",id:a.id}).then(function(r){
  b.disabled=false;
  if(r.status===401){if(win)win.close();logout();return}
  if(r.j&&r.j.item)items=items.map(function(x){return x.id===a.id?r.j.item:x});
  if(!r.ok){if(win)win.close();say(r.j.error||"Couldn’t prepare the WhatsApp message.",true);draw();return}
  if(win){win.location.href=r.j.link;say("WhatsApp is open with the confirmation for "+a.name+". Press send in WhatsApp to deliver it.")}
  else{var m=$("msg");m.className="msg";m.textContent="Your browser blocked the pop-up. ";var l=el("a","btn","Open WhatsApp message");l.href=r.j.link;l.target="_blank";l.rel="noopener";m.appendChild(l)}
  draw();
 });
}
function resetWa(a,b){
 if(!confirm("Allow another WhatsApp confirmation to be sent to "+a.name+"?"))return;
 b.disabled=true;
 api({action:"whatsapp_reset",id:a.id}).then(function(r){
  b.disabled=false;
  if(r.status===401){logout();return}
  if(!r.ok){say(r.j.error||"Couldn’t update. Please try again.",true);return}
  items=items.map(function(x){return x.id===a.id?r.j.item:x});say("Done. A new WhatsApp confirmation can be sent.");draw();
 });
}
function btn(t,c,f){var b=el("button",c,t);b.type="button";b.onclick=function(){f(b)};return b}
function drawActivity(){
 var list=$("list");list.innerHTML="";
 var loading=el("div","card","Loading activity…");list.appendChild(loading);
 api({action:"activity"}).then(function(r){
  list.innerHTML="";
  if(r.status===401){logout();return}
  if(!r.ok){say(r.j.error||"Could not load the activity log.",true);return}
  if(!r.j.items||!r.j.items.length){list.appendChild(el("div","card","No staff activity has been recorded yet."));return}
  list.appendChild(el("p","meta","Showing the 100 most recent appointment changes."));
  r.j.items.forEach(function(item){
   var card=el("article","card"),head=el("div","row");
   var action=item.type==="appointment_deleted"?"Deleted appointment":item.type==="appointment_status"?"Changed appointment status":item.type==="whatsapp_confirmation"?"Sent WhatsApp confirmation":item.type==="whatsapp_confirmation_reset"?"Allowed a WhatsApp resend":"Staff activity";
   head.appendChild(el("h2","",action));
   if(item.status)head.appendChild(el("span","badge "+(item.status==="confirmed"?"confirmed":(item.status==="declined"||item.status==="deleted")?"declined":"pending"),item.status));
   card.appendChild(head);
   card.appendChild(el("p","meta","By "+item.staffName));
   if(item.appointment){
    card.appendChild(el("p","",item.appointment.name+" · "+item.appointment.service));
    card.appendChild(el("p","meta",item.appointment.date+" at "+item.appointment.time));
   }else{
    card.appendChild(el("p","meta","The related appointment is no longer available."));
   }
   if(item.at)card.appendChild(el("p","meta",new Date(item.at).toLocaleString("en-ZA",{dateStyle:"medium",timeStyle:"short"})));
   list.appendChild(card);
  });
 });
}
function drawStaff(){
 var list=$("list");list.innerHTML="";
 var form=el("form","card");form.appendChild(el("h2","","Add staff member"));
 var name=el("input");name.placeholder="Full name";name.required=true;name.autocomplete="name";
 var username=el("input");username.placeholder="Username";username.required=true;username.autocomplete="off";
 var password=el("input");password.placeholder="Temporary password (12+ characters)";password.type="password";password.minLength=12;password.required=true;
 [name,username,password].forEach(function(x){x.style.marginTop="10px";form.appendChild(x)});
 var submit=el("button","","Create account");submit.type="submit";form.appendChild(submit);
 form.onsubmit=function(e){e.preventDefault();submit.disabled=true;api({action:"staff_create",name:name.value,username:username.value,password:password.value}).then(function(r){submit.disabled=false;if(!r.ok){say(r.j.error||"Could not create account.",true);return}say("Staff account created.");drawStaff()})};list.appendChild(form);
 api({action:"staff_list"}).then(function(r){if(!r.ok){say(r.j.error||"Could not load staff accounts.",true);return}r.j.users.forEach(function(u){var card=el("article","card"),head=el("div","row");head.appendChild(el("h2","",u.name));head.appendChild(el("span","badge "+(u.disabled?"declined":"confirmed"),u.role==="doctor"?"doctor":(u.disabled?"disabled":"active")));card.appendChild(head);card.appendChild(el("p","meta","@"+u.username));if(u.role==="staff"){var actions=el("div","acts");actions.appendChild(btn(u.disabled?"Enable account":"Disable account",u.disabled?"":"no",function(b){b.disabled=true;api({action:u.disabled?"staff_enable":"staff_disable",userId:u.id}).then(function(x){b.disabled=false;if(!x.ok){say(x.j.error||"Could not update account.",true);return}drawStaff()})}));card.appendChild(actions)}else{card.appendChild(el("p","meta","Owner account · managed through secure doctor access."));}list.appendChild(card)})});
}
function drawAccount(){
 var list=$("list");list.innerHTML="";
 var card=el("form","card");
 card.appendChild(el("h2","","Change your password"));
 card.appendChild(el("p","meta","Signed in as "+currentUser.name+" (@"+currentUser.username+")."));
 function field(labelText,id,autocomplete){
  var label=el("label","meta",labelText);label.htmlFor=id;card.appendChild(label);
  var input=el("input");input.id=id;input.type="password";input.required=true;input.autocomplete=autocomplete;input.style.marginTop="6px";input.minLength=12;card.appendChild(input);return input;
 }
 var current=field("Current password","currentPassword","current-password");
 var next=field("New password (at least 12 characters)","newPassword","new-password");
 var confirm=field("Confirm new password","confirmPassword","new-password");
 var hint=el("p","meta","Changing your password will sign out other devices using this account.");
 card.appendChild(hint);
 var submit=el("button","","Update password");submit.type="submit";card.appendChild(submit);
 card.onsubmit=function(e){
  e.preventDefault();
  if(next.value!==confirm.value){say("The new passwords do not match.",true);confirm.focus();return}
  if(next.value.length<12){say("Your new password must be at least 12 characters.",true);next.focus();return}
  submit.disabled=true;say("");
  var remember=false;
  try{remember=localStorage.getItem("hev_t")===T}catch(x){}
  api({action:"change_password",currentPassword:current.value,newPassword:next.value,remember:remember}).then(function(r){
   submit.disabled=false;
   if(r.status===401){logout();return}
   if(!r.ok){say(r.j.error||"Could not change your password.",true);return}
   T=r.j.token;currentUser=r.j.user;
   try{
    if(localStorage.getItem("hev_t"))localStorage.setItem("hev_t",T);
    else sessionStorage.setItem("hev_t",T);
   }catch(x){}
   current.value="";next.value="";confirm.value="";
   say("Your password has been changed. Other devices have been signed out.");
  });
 };
 list.appendChild(card);
 drawPushSettings();
}
function urlBase64ToUint8Array(value){
 var padding="=".repeat((4-value.length%4)%4);
 var base64=(value+padding).replace(/-/g,"+").replace(/_/g,"/");
 var raw=atob(base64),output=new Uint8Array(raw.length);
 for(var i=0;i<raw.length;i++)output[i]=raw.charCodeAt(i);
 return output;
}
function drawPushSettings(){
 var list=$("list"),card=el("section","card");
 card.appendChild(el("h2","","Push notifications"));
 card.appendChild(el("p","meta","Get an alert on this device when a new appointment request arrives. Notifications do not show patient details."));
 var status=el("p","meta","Checking notification support…");card.appendChild(status);
 var actions=el("div","acts"),enable=btn("Enable notifications","",async function(button){
  button.disabled=true;status.textContent="Requesting permission…";
  try{
   if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))throw new Error("Push notifications are not supported by this browser.");
   if(Notification.permission!=="granted"){
    var permission=await Notification.requestPermission();
    if(permission!=="granted")throw new Error("Notifications were not allowed. You can change this in your device settings.");
   }
   var keyResult=await api({action:"push_public_key"});
   if(!keyResult.ok||!keyResult.j.publicKey)throw new Error("Push notifications are not configured on the server yet.");
   var registration=await navigator.serviceWorker.ready;
   var subscription=await registration.pushManager.getSubscription();
   if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyResult.j.publicKey)});
   var saved=await api({action:"push_subscribe",subscription:subscription.toJSON()});
   if(!saved.ok)throw new Error(saved.j.error||"Could not save this device.");
   status.textContent="Notifications are enabled on this device.";
  }catch(error){status.textContent=error.message||"Could not enable notifications."}
  button.disabled=false;
 });
 var disable=btn("Turn off on this device","ghost",async function(button){
  button.disabled=true;
  try{
   var registration=await navigator.serviceWorker.ready;
   var subscription=await registration.pushManager.getSubscription();
   if(subscription){
    await api({action:"push_unsubscribe",endpoint:subscription.endpoint});
    await subscription.unsubscribe();
   }
   status.textContent="Notifications are turned off on this device.";
  }catch(error){status.textContent=error.message||"Could not turn off notifications."}
  button.disabled=false;
 });
 actions.appendChild(enable);actions.appendChild(disable);card.appendChild(actions);
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
  status.textContent="This browser does not support push notifications.";
  enable.disabled=true;disable.disabled=true;
 }else if(Notification.permission==="denied"){
  status.textContent="Notifications are blocked in this browser's settings. Allow them there to enable alerts.";
  enable.disabled=true;
 }else{
  navigator.serviceWorker.ready.then(function(registration){
   registration.pushManager.getSubscription().then(function(subscription){
    status.textContent=subscription?"Notifications are enabled on this device.":"Notifications are not enabled on this device yet.";
   });
  }).catch(function(){status.textContent="Open this app online to set up notifications."});
 }
 list.appendChild(card);
}
function drawRevs(){
 var list=$("list");list.innerHTML="";
 if(!revs.length){var e=el("div","card","No reviews yet.");e.style.color="var(--sub)";list.appendChild(e);return}
 var cls={approved:"confirmed",rejected:"declined",pending:"pending"};
 revs.forEach(function(r){
  var c=el("article","card"),h=el("div","row");
  h.appendChild(el("h2","",r.name));h.appendChild(el("span","badge "+cls[r.status],r.status));c.appendChild(h);
  c.appendChild(el("p","meta",new Array(r.rating+1).join("★")+new Array(6-r.rating).join("☆")+" · "+new Date(r.created).toLocaleDateString("en-ZA")));
  c.appendChild(el("p","",r.text));
  var acts=el("div","acts");
  if(r.status!=="approved")acts.appendChild(btn("Approve and show","",function(b){setRev(r,"approved",b)}));
  if(r.status==="approved")acts.appendChild(btn("Hide","no",function(b){setRev(r,"rejected",b)}));
  if(r.status==="pending")acts.appendChild(btn("Reject","no",function(b){setRev(r,"rejected",b)}));
  acts.appendChild(btn("Delete","no",function(b){if(confirm("Delete this review permanently?"))setRev(r,"delete",b)}));
  c.appendChild(acts);list.appendChild(c);
 });
}
function setRev(r,status,b){
 b.disabled=true;
 api({action:"review_set",id:r.id,status:status}).then(function(x){
  b.disabled=false;
  if(x.status===401){logout();return}
  if(!x.ok){say(x.j.error||"Couldn’t update. Please try again.",true);return}
  revs=status==="delete"?revs.filter(function(q){return q.id!==r.id}):revs.map(function(q){return q.id===r.id?x.j.item:q});
  say(status==="approved"?"Review is now showing on the website.":"Updated.");draw();
 });
}
function del(a,b){
 if(!confirm("Permanently delete the appointment for "+a.name+"? This can’t be undone."))return;
 b.disabled=true;
 api({action:"delete",id:a.id}).then(function(r){
  b.disabled=false;
  if(r.status===401){logout();return}
  if(!r.ok){say(r.j.error||"Couldn’t delete. Please try again.",true);return}
  items=items.filter(function(x){return x.id!==a.id});say("Deleted.");draw();
 });
}
function set(a,status,b){
 if(status==="declined"&&!confirm("Decline or cancel the appointment for "+a.name+"?"))return;
 b.disabled=true;
 api({action:"update",id:a.id,status:status}).then(function(r){
  b.disabled=false;
  if(r.status===401){logout();return}
  if(!r.ok){say(r.j.error||"Couldn’t update. Please try again.",true);return}
  items=items.map(function(x){return x.id===a.id?r.j.item:x});
  if(status==="confirmed")say(!a.whatsappConsent?"Confirmed. No WhatsApp consent was given; please contact "+a.name+" by phone.":"Confirmed. Press “Confirm via WhatsApp” on their card to send "+a.name+" the confirmation.");
  else say("Updated. Please contact "+a.name+" by phone if they need to be notified.");
  draw();
 });
}
$("login").onsubmit=function(e){
 e.preventDefault();var b=e.target.querySelector("button");b.disabled=true;$("loginErr").textContent="";
 api({action:"login",username:$("username").value,password:$("pw").value,remember:$("rem").checked}).then(function(r){
  b.disabled=false;
  if(!r.ok){$("loginErr").textContent=r.j.error||"Couldn’t sign in.";return}
  T=r.j.token;currentUser=r.j.user;try{(($("rem").checked)?localStorage:sessionStorage).setItem("hev_t",T)}catch(x){}
  $("pw").value="";show(true);load();
 });
};
$("refresh").onclick=load;$("out").onclick=logout;
 $("showSetup").onclick=function(){$("login").hidden=true;$("setup").hidden=false};
 $("hideSetup").onclick=function(){$("setup").hidden=true;$("login").hidden=false};
 $("setup").onsubmit=function(e){e.preventDefault();var b=e.target.querySelector("button[type=submit]");b.disabled=true;$("setupErr").textContent="";api({action:"bootstrap",setupSecret:$("setupSecret").value,name:$("doctorName").value,username:$("doctorUsername").value,password:$("doctorPassword").value}).then(function(r){b.disabled=false;if(!r.ok){$("setupErr").textContent=r.j.error||"Setup failed.";return}$("setup").hidden=true;$("login").hidden=false;$("loginErr").textContent="Doctor account created. Please sign in."; $("username").value=$("doctorUsername").value;$("pw").value=$("doctorPassword").value})};
if(T){show(true);api({action:"me"}).then(function(r){if(r.status===401||!r.ok){logout();return}currentUser=r.j.user;load()})}
setInterval(function(){if(T&&!document.hidden)load()},60000);
})();
</script>
